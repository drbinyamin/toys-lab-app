name: Deploy store connection (API)

# Deploys the server in worker/ to Cloudflare Workers.
# Needs these repository secrets:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   SALLA_CLIENT_ID, SALLA_CLIENT_SECRET, SALLA_WEBHOOK_SECRET
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SALLA_CLIENT_ID: ${{ secrets.SALLA_CLIENT_ID }}
      SALLA_CLIENT_SECRET: ${{ secrets.SALLA_CLIENT_SECRET }}
      SALLA_WEBHOOK_SECRET: ${{ secrets.SALLA_WEBHOOK_SECRET }}
    steps:
      - name: Check secrets are set
        working-directory: .
        run: |
          missing=""
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SALLA_CLIENT_ID SALLA_CLIENT_SECRET SALLA_WEBHOOK_SECRET; do
            [ -z "${!s}" ] && missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Create or find the storage
        run: |
          find_id() { npx wrangler kv namespace list 2>/dev/null | sed -n '/^\[/,$p' | jq -r '[.[] | select(.title | endswith("toyslab-store"))][0].id // empty'; }
          id=$(find_id)
          if [ -z "$id" ]; then
            npx wrangler kv namespace create toyslab-store
            id=$(find_id)
          fi
          if [ -z "$id" ]; then echo "::error::Could not create the KV storage"; exit 1; fi
          sed -i "s/KV_NAMESPACE_ID/$id/" wrangler.toml
          echo "Storage: $id"

      - name: Deploy
        id: deploy
        run: |
          npx wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Set Salla secrets on the server
        run: |
          jq -n --arg a "$SALLA_CLIENT_ID" --arg b "$SALLA_CLIENT_SECRET" --arg c "$SALLA_WEBHOOK_SECRET" \
            '{SALLA_CLIENT_ID:$a, SALLA_CLIENT_SECRET:$b, SALLA_WEBHOOK_SECRET:$c}' > secrets.json
          npx wrangler secret bulk secrets.json
          rm -f secrets.json

      - name: Summary
        run: |
          url="${{ steps.deploy.outputs.url }}"
          {
            echo "## Store connection is live"
            echo ""
            echo "| | Address |"
            echo "|---|---|"
            echo "| Status page | $url/ |"
            echo "| **Webhook URL for Salla** | \`$url/webhook\` |"
            echo "| Product list for the app | $url/catalog |"
          } >> "$GITHUB_STEP_SUMMARY"
