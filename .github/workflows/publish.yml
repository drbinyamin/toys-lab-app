name: Publish to phones

# Every push to main sends the new version of the app to Expo,
# so it shows up on phones that open the app in Expo Go.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'worker/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check the Expo token is set
        id: token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::warning::EXPO_TOKEN secret is not set yet. Add it in Settings → Secrets and variables → Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        if: steps.token.outputs.ready == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install
        if: steps.token.outputs.ready == 'true'
        run: npm ci

      - name: Link the Expo project (first run only)
        if: steps.token.outputs.ready == 'true'
        run: |
          if ! grep -q '"projectId"' app.json; then
            eas init --non-interactive --force
            eas update:configure --platform all --non-interactive || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app.json
            git commit -m "Link Expo project [skip ci]" || true
            git push
          fi

      - name: Match the project owner on Expo
        # The project can move between accounts (e.g. into the toyslab organization).
        # Ask Expo who owns it now and use that, so publishing keeps working.
        if: steps.token.outputs.ready == 'true'
        run: |
          id=$(jq -r '.expo.extra.eas.projectId // empty' app.json)
          [ -z "$id" ] && exit 0
          owner=$(curl -sS https://api.expo.dev/graphql \
            -H "Authorization: Bearer $EXPO_TOKEN" -H "Content-Type: application/json" \
            -d "{\"query\":\"query { app { byId(appId: \\\"$id\\\") { ownerAccount { name } } } }\"}" \
            | jq -r '.data.app.byId.ownerAccount.name // empty')
          echo "Project owner on Expo: ${owner:-unknown}"
          if [ -n "$owner" ]; then
            jq --arg o "$owner" '.expo.owner = $o' app.json > app.tmp && mv app.tmp app.json
          fi

      - name: Publish update
        if: steps.token.outputs.ready == 'true'
        env:
          MESSAGE: ${{ github.event.head_commit.message || 'Manual publish' }}
        run: eas update --channel main --message "$MESSAGE" --non-interactive
